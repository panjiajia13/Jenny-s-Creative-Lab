<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PAWTUNE — Open it. See what happens.</title>
<style>
  /* ---------- Fonts (OFL, bundled in /assets/fonts) ---------- */
  @font-face{
    font-family:'Fraunces';
    src:url('../assets/fonts/Fraunces.ttf') format('truetype');
    font-weight:100 900; font-style:normal; font-display:block;
  }
  @font-face{
    font-family:'Fraunces';
    src:url('../assets/fonts/Fraunces-Italic.ttf') format('truetype');
    font-weight:100 900; font-style:italic; font-display:block;
  }
  @font-face{
    font-family:'Hanken Grotesk';
    src:url('../assets/fonts/HankenGrotesk.ttf') format('truetype');
    font-weight:100 900; font-style:normal; font-display:block;
  }

  :root{
    --cream:#F4EFE3;        /* background canvas        */
    --canvas:#FBF7EE;       /* bag body (a touch lighter)*/
    --canvas-shade:#E9E0CF; /* bag side shading          */
    --canvas-deep:#DCD2BD;  /* bag deepest fold          */
    --cognac:#A85C2E;       /* leather accent            */
    --cognac-dk:#8C4A22;    /* leather edge / stitch dk  */
    --cognac-lt:#BE7038;    /* leather highlight         */
    --ink:#352F26;          /* charcoal type             */
    --pewter:#9A9488;       /* secondary detail          */
    --pewter-lt:#BCB6AA;
    --wave:#8F8B80;         /* soundwave grey            */
    --thread:#D8CDB7;       /* stitch on canvas          */
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#cfcabd;}
  /* The exact export frame */
  #stage{
    position:relative;
    width:1080px;height:1350px;
    background:
      radial-gradient(125% 95% at 64% 30%, #F7F2E7 0%, #F4EFE3 46%, #EFE8D9 100%);
    overflow:hidden;
    font-family:'Hanken Grotesk',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  /* faint paper tooth */
  #stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(53,47,38,.025) 1px, transparent 1px);
    background-size:7px 7px;opacity:.5;mix-blend-mode:multiply;
  }

  /* ---------- Logo (top-left, thumbnail scale) ---------- */
  .logo{position:absolute;left:96px;top:92px;display:flex;align-items:center;gap:18px;z-index:6;}
  .logo .mark{width:42px;height:42px;display:block;}
  .logo .word{
    font-family:'Hanken Grotesk';font-weight:600;font-size:18px;
    letter-spacing:.34em;color:var(--ink);text-transform:uppercase;
    padding-left:2px;
  }

  /* ---------- Headline block ---------- */
  .copy{position:absolute;left:96px;top:198px;z-index:6;width:560px;}
  .eyebrow{
    font-family:'Hanken Grotesk';font-weight:600;font-size:15px;
    letter-spacing:.30em;text-transform:uppercase;color:var(--cognac);
    margin-bottom:28px;
  }
  .headline{
    font-family:'Fraunces';
    font-variation-settings:"opsz" 144,"wght" 368,"SOFT" 0,"WONK" 0;
    font-weight:368;
    font-size:104px;line-height:.97;letter-spacing:-0.018em;
    color:var(--ink);
  }
  .headline .it{
    font-style:italic;
    font-variation-settings:"opsz" 144,"wght" 360,"SOFT" 0,"WONK" 0;
    color:#403828;
  }
  .headline .l1{display:block;}
  .headline .l2{display:block;}
  .headline .l3{display:block;}

  .sub{
    position:absolute;left:98px;top:592px;z-index:6;width:300px;
    font-family:'Hanken Grotesk';font-weight:430;
    font-size:17px;line-height:1.62;letter-spacing:.004em;
    color:#5C5343;
  }
  .sub .dot{color:var(--cognac);font-weight:700;}

  /* ---------- Footer micro-line ---------- */
  .foot{
    position:absolute;left:96px;bottom:74px;z-index:6;
    font-family:'Hanken Grotesk';font-weight:600;font-size:13px;
    letter-spacing:.26em;text-transform:uppercase;color:#8A8170;
  }
  .foot .sep{color:var(--cognac);padding:0 10px;}
  .price{
    position:absolute;right:96px;bottom:70px;z-index:6;text-align:right;
    font-family:'Fraunces';font-variation-settings:"opsz" 40,"wght" 460;
    font-size:22px;color:var(--ink);
  }
  .price small{
    display:block;font-family:'Hanken Grotesk';font-weight:600;
    font-size:11px;letter-spacing:.24em;text-transform:uppercase;
    color:#8A8170;margin-top:6px;
  }

  svg{position:absolute;inset:0;z-index:3;}
  #art{transform:translate(40px,18px);}            /* nudge product off-centre, clear of type */
  #fx{z-index:2;transform:translate(40px,18px);}   /* quiet soundwave→cat line, behind product edge */
</style>
</head>
<body>
<div id="stage">

  <!-- soft signature line layer (behind product, trails into the open) -->
  <svg id="fx" width="1080" height="1350" viewBox="0 0 1080 1350" fill="none"></svg>

  <!-- logo -->
  <div class="logo">
    <svg class="mark" viewBox="0 0 64 64" fill="none" aria-label="PAWTUNE">
      <!-- paw -->
      <g fill="#352F26">
        <ellipse cx="32" cy="40" rx="13" ry="10.5"/>
        <ellipse cx="18.5" cy="27" rx="4.6" ry="6"/>
        <ellipse cx="27" cy="20.5" rx="4.4" ry="6.2"/>
        <ellipse cx="37" cy="20.5" rx="4.4" ry="6.2"/>
        <ellipse cx="45.5" cy="27" rx="4.6" ry="6"/>
      </g>
      <!-- tiny soundwave through the pad -->
      <g stroke="#FBF7EE" stroke-width="2" stroke-linecap="round">
        <line x1="25" y1="40" x2="25" y2="40.2"/>
        <line x1="28.5" y1="37" x2="28.5" y2="43"/>
        <line x1="32" y1="34.5" x2="32" y2="45.5"/>
        <line x1="35.5" y1="37" x2="35.5" y2="43"/>
        <line x1="39" y1="39" x2="39" y2="41"/>
      </g>
    </svg>
    <span class="word">Pawtune</span>
  </div>

  <!-- headline -->
  <div class="copy">
    <div class="eyebrow">The Musician&rsquo;s Tote</div>
    <h1 class="headline">
      <span class="l1">Open it.</span>
      <span class="l2">See what</span>
      <span class="l3"><span class="it">happens.</span></span>
    </h1>
  </div>

  <div class="sub">
    Cat ears, a brass paw clasp, and your favourite
    waveform pressed into the cloth.
    <span class="dot">·</span> Made for cat people who make things.
  </div>

  <!-- the product -->
  <svg id="art" width="1080" height="1350" viewBox="0 0 1080 1350" fill="none">
    <defs>
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"   stop-color="#E1D7C2"/>
        <stop offset="0.14" stop-color="#F2ECDF"/>
        <stop offset="0.5"  stop-color="#FCF8F0"/>
        <stop offset="0.86" stop-color="#EFE8DA"/>
        <stop offset="1"   stop-color="#DDD2BC"/>

      <linearGradient id="insideGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#B6AB92"/>
        <stop offset="1" stop-color="#D8CEB9"/>
      </linearGradient>
      <linearGradient id="cognacGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#C2783E"/>
        <stop offset="0.5" stop-color="#A85C2E"/>
        <stop offset="1"   stop-color="#8A4920"/>
      </linearGradient>
      <linearGradient id="cognacGradH" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"   stop-color="#9A5024"/>
        <stop offset="0.5" stop-color="#B4682F"/>
        <stop offset="1"   stop-color="#8A4920"/>
      </linearGradient>
      <radialGradient id="brass" cx="0.38" cy="0.32" r="0.85">
        <stop offset="0"   stop-color="#D7CBA8"/>
        <stop offset="0.45" stop-color="#B3A47C"/>
        <stop offset="0.8" stop-color="#8A7B57"/>
        <stop offset="1"   stop-color="#67583C"/>
      </radialGradient>
      <radialGradient id="brassPad" cx="0.5" cy="0.4" r="0.8">
        <stop offset="0" stop-color="#6B5C40"/>
        <stop offset="1" stop-color="#8E7F5C"/>
      </radialGradient>
      <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="16"/>
      </filter>
      <filter id="bodyAO" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="9"/>
      </filter>
    </defs>

    <!-- ground shadow -->
    <ellipse cx="616" cy="1152" rx="214" ry="23" fill="#2B2418" opacity="0.16" filter="url(#softShadow)"/>

    <!-- back: cat ears poking above the rim -->
    <g>
      <!-- left ear -->
      <path d="M 470 760 L 492 646 L 540 760 Z" fill="#F3EEE1" stroke="#E2D8C4" stroke-width="2"/>
      <path d="M 486 742 L 497 678 L 524 748 Z" fill="#A7A091"/>
      <!-- right ear -->
      <path d="M 690 760 L 738 646 L 760 760 Z" fill="#F0E9DB" stroke="#E2D8C4" stroke-width="2"/>
      <path d="M 706 748 L 733 678 L 744 742 Z" fill="#9D968880"/>
      <path d="M 706 748 L 733 678 L 744 742 Z" fill="#A7A091"/>
    </g>

    <!-- a sliver of the opening interior behind the front panel -->

             C 524 786, 464 776, 430 748 Z" fill="url(#insideGrad)"/>

    <!-- BAG BODY (front panel) -->
    <path d="M 420 760
             C 480 750, 545 752, 612 762
             C 679 752, 744 750, 804 760
             L 798 1104
             C 798 1126, 782 1136, 760 1138
             C 712 1146, 662 1148, 612 1147
             C 562 1148, 512 1146, 464 1138
             C 442 1136, 426 1126, 426 1104
             Z" fill="url(#bodyGrad)"/>
    <!-- inner ambient shading on body sides -->
    <path d="M 420 760 C 470 752, 470 752, 470 752 L 470 1140
             C 448 1136, 430 1126, 426 1104 Z" fill="#CFC4AD" opacity="0.45" filter="url(#bodyAO)"/>
    <path d="M 804 760 C 760 752, 760 752, 760 752 L 760 1140
             C 782 1136, 798 1126, 798 1104 Z" fill="#CCC1A9" opacity="0.5" filter="url(#bodyAO)"/>
    <!-- gentle gather folds under the rim -->
    <g stroke="#DBD0BA" stroke-width="2.4" fill="none" opacity="0.7" stroke-linecap="round">
      <path d="M 470 772 C 474 800, 472 822, 466 846"/>
      <path d="M 524 776 C 526 804, 524 826, 520 852"/>
      <path d="M 700 776 C 698 804, 700 826, 704 852"/>
      <path d="M 754 772 C 750 800, 752 822, 758 846"/>
    </g>
    <!-- top rim band -->
    <path d="M 420 760 C 480 750, 545 752, 612 762 C 679 752, 744 750, 804 760"
          stroke="#E7DDC8" stroke-width="3.5" fill="none"/>

    <!-- HANDLES (two loops) -->
    <g fill="none" stroke-linecap="round">
      <!-- left handle -->
      <path d="M 528 762 C 512 628, 526 520, 568 486 C 610 520, 624 628, 608 762"
            stroke="#E4DAC5" stroke-width="25"/>
      <path d="M 528 762 C 512 628, 526 520, 568 486 C 610 520, 624 628, 608 762"
            stroke="#FBF7EE" stroke-width="19"/>
      <path d="M 528 762 C 512 628, 526 520, 568 486 C 610 520, 624 628, 608 762"
            stroke="#D9CDB5" stroke-width="1.4" stroke-dasharray="5 6" opacity="0.8"/>
      <!-- right handle -->
      <path d="M 632 762 C 616 628, 630 520, 672 486 C 714 520, 728 628, 712 762"
            stroke="#E0D6C1" stroke-width="25"/>
      <path d="M 632 762 C 616 628, 630 520, 672 486 C 714 520, 728 628, 712 762"
            stroke="#FAF6ED" stroke-width="19"/>
      <path d="M 632 762 C 616 628, 630 520, 672 486 C 714 520, 728 628, 712 762"
            stroke="#D7CBB3" stroke-width="1.4" stroke-dasharray="5 6" opacity="0.8"/>
    </g>

    <!-- CENTRE COGNAC STRAP folding over the rim -->
    <g>
      <path d="M 583 736 L 641 736 L 639 884 C 639 892, 632 898, 612 898
               C 592 898, 585 892, 585 884 Z" fill="url(#cognacGrad)"/>
      <path d="M 583 736 L 641 736 L 640 752 L 584 752 Z" fill="#7E4220" opacity="0.55"/>
      <g stroke="#7C3F1C" stroke-width="1.6" stroke-dasharray="6 6" opacity="0.6" fill="none">
        <line x1="592" y1="744" x2="592" y2="876"/>
        <line x1="632" y1="744" x2="632" y2="876"/>
      </g>
      <!-- highlight -->
      <path d="M 600 740 L 606 740 L 605 880 L 600 880 Z" fill="#D08A4E" opacity="0.5"/>
    </g>

    <!-- PAW CLASP (antique brass) -->
    <g>
      <ellipse cx="612" cy="876" rx="46" ry="50" fill="url(#brass)" stroke="#5C4E34" stroke-width="2"/>
      <ellipse cx="612" cy="872" rx="38" ry="42" fill="none" stroke="#EFE6CB" stroke-width="1.2" opacity="0.5"/>
      <g fill="url(#brassPad)">
        <ellipse cx="612" cy="889" rx="17.5" ry="14"/>
        <ellipse cx="595" cy="871" rx="6" ry="8"/>
        <ellipse cx="606" cy="861" rx="5.6" ry="8.4"/>
        <ellipse cx="618" cy="861" rx="5.6" ry="8.4"/>
        <ellipse cx="629" cy="871" rx="6" ry="8"/>

    </g>

    <!-- BOTTOM LEATHER CORNERS + rivets -->

      <!-- left -->
      <path d="M 426 1066 C 426 1126, 444 1136, 466 1138

      <path d="M 540 1100 L 540 1145 C 540 1145, 506 1144, 466 1138

               stroke-dasharray="6 6" opacity="0.55"/>

      <!-- right -->
      <path d="M 798 1066 C 798 1126, 780 1136, 758 1138
               C 718 1144, 684 1145, 684 1145 L 684 1100
               C 684 1100, 754 1092, 772 1066 Z" fill="url(#cognacGradH)"/>
      <path d="M 684 1100 L 684 1145 C 684 1145, 718 1144, 758 1138
               C 780 1136, 798 1126, 798 1066" fill="none" stroke="#7C3F1C" stroke-width="1.4"
               stroke-dasharray="6 6" opacity="0.55"/>
      <circle cx="754" cy="1112" r="4.6" fill="#D9C9A6" stroke="#6E5A34" stroke-width="1"/>
    </g>

    <!-- SIDE drawstring cords + knots -->
    <g stroke-linecap="round">
      <!-- left side cord -->
      <path d="M 426 866 C 398 874, 388 902, 392 936 C 394 956, 404 968, 408 984"
            stroke="#EDE3CE" stroke-width="6" fill="none"/>
      <circle cx="392" cy="916" r="9" fill="#F3EBD8" stroke="#D8CDB5" stroke-width="1.5"/>
      <!-- left side leather tab + buckle -->
      <rect x="412" y="846" width="22" height="50" rx="6" fill="url(#cognacGrad)"/>
      <rect x="416" y="862" width="14" height="9" rx="2.5" fill="none" stroke="#6E371A" stroke-width="2"/>
      <!-- right side cord -->
      <path d="M 798 866 C 826 874, 836 902, 832 936 C 830 956, 820 968, 816 984"
            stroke="#EDE3CE" stroke-width="6" fill="none"/>
      <circle cx="832" cy="916" r="9" fill="#F3EBD8" stroke="#D8CDB5" stroke-width="1.5"/>
      <rect x="790" y="846" width="22" height="50" rx="6" fill="url(#cognacGradH)"/>
      <rect x="794" y="862" width="14" height="9" rx="2.5" fill="none" stroke="#6E371A" stroke-width="2"/>
    </g>
  </svg>

  <!-- footer -->
  <div class="foot">Canvas <span class="sep">/</span> Cognac leather <span class="sep">/</span> Brass</div>
  <div class="price">No.&nbsp;01 &mdash; The Tote<small>Pawtune Studio</small></div>

</div>

<script>
/* ============================================================
   Generative bits: soundwave on the bag, and the quiet
   single line that trails off the product and resolves into
   the faint outline of a sitting cat in the lower-left.
   ============================================================ */
const SVGNS="http://www.w3.org/2000/svg";
function el(name,attrs){const e=document.createElementNS(SVGNS,name);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}

/* ---- product geometry (slightly off-centre, lower middle) ---- */
const BAG = { cx: 612, top: 742, bottom: 1138, halfTop: 196, halfBot: 182 };

/* ---------- 1. SOUNDWAVE PRINT on the bag front ---------- */
(function soundwave(){
  const art=document.getElementById('art');
  const g=el('g',{});
  const cx=BAG.cx, midY=988;          // baseline of the printed wave
  const n=47, step=7.0;               // bars
  const span=(n-1)*step;
  const startX=cx-span/2;
  // a smooth envelope, tallest at centre, with musical jitter
  const env=i=>{const t=(i/(n-1))*2-1; return Math.exp(-3.0*t*t);};
  const jit=[ .42,.7,.5,.86,.6,.95,.72,1,.66,.9,.55,.8,.62,.93,.7,.99,.74,1,.8,
              .9,.7,1,.78,.94,.7,.88,.74,1,.66,.92,.6,.85,.7,.95,.6,.8,.5,.72,
              .55,.84,.5,.7,.46,.62,.44,.56,.4 ];
  for(let i=0;i<n;i++){
    const x=startX+i*step;
    const h=Math.max(5, env(i)*112*jit[i%jit.length]);
    g.appendChild(el('line',{x1:x,y1:midY-h/2,x2:x,y2:midY+h/2,
      stroke:'#8F8B80','stroke-width':3.0,'stroke-linecap':'round',opacity:0.92}));
  }
  art.appendChild(g);
})();

/* ---------- 2. THE QUIET LINE → SITTING CAT (the hook) ----------
   A single thin stroke leaves the left end of the soundwave,
   slips off the bag, drifts into the open lower-left and
   becomes the outline of a small sitting cat. Easy to miss. */
(function hook(){
  const fx=document.getElementById('fx');
  const g=el('g',{stroke:'#9A9488','stroke-width':2.1,'stroke-linecap':'round',
                  'stroke-linejoin':'round',fill:'none'});

  // (a) the soundwave's left end slips off the bag and becomes the cat's tail.
  const waveBaseY=988;
  const leaveX=BAG.cx-162;                 // near left end of printed wave
  const trail=el('path',{opacity:0.44, d:
    `M ${leaveX} ${waveBaseY}
     C ${leaveX-70} ${waveBaseY+10}, 348 1012, 334 1048
     C 326 1066, 332 1082, 350 1088
     C 372 1095, 380 1118, 372 1140
     C 366 1158, 348 1168, 326 1162`});
  g.appendChild(trail);

  // (b) the sitting cat (back view) — the quiet, easy-to-miss outline.
  //     ears at top, body widening to a seated base, tail (the trail above) curling at its side.
  const cat=el('path',{opacity:0.52, d:
    `M 200 1158
     C 190 1112, 200 1066, 222 1034
     C 230 1022, 234 1014, 236 1004
     L 226 976
     L 248 1000
     C 254 994, 264 994, 270 1000
     L 292 976
     L 282 1004
     C 284 1014, 288 1022, 296 1034
     C 318 1066, 328 1112, 318 1158
     C 280 1170, 238 1170, 200 1158 Z`});
  g.appendChild(cat);

  fx.appendChild(g);
})();
</script>
</body>
</html>
