<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face{font-family:'Fraunces';src:url('../assets/fonts/Fraunces.ttf') format('truetype');font-weight:400 900;font-style:normal;font-display:block;}
  @font-face{font-family:'Fraunces';src:url('../assets/fonts/Fraunces-Italic.ttf') format('truetype');font-weight:400 900;font-style:italic;font-display:block;}
  @font-face{font-family:'Hanken Grotesk';src:url('../assets/fonts/HankenGrotesk.ttf') format('truetype');font-weight:300 800;font-style:normal;font-display:block;}
  :root{
    --cream:#F2ECDD; --cream-hi:#FBF6EC; --cream-lo:#DED2BB;
    --cognac:#A85C2E; --charcoal:#241f18; --ink:#332c22; --pewter:#8B8579;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#c9c4ba;}
  #stage{position:relative;width:1600px;height:900px;overflow:hidden;
    font-family:'Hanken Grotesk',sans-serif;color:var(--ink);
    background:radial-gradient(140% 130% at 50% -8%, var(--cream-hi) 0%, var(--cream) 44%, var(--cream-lo) 100%);}
  #light{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(60% 40% at 50% 8%, rgba(255,244,214,.5), rgba(255,244,214,0) 60%);mix-blend-mode:screen;}
  #vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 108% at 50% 48%, rgba(0,0,0,0) 55%, rgba(40,28,16,.20) 100%);}
  #grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:multiply;pointer-events:none;}
  .head{position:absolute;top:60px;left:0;right:0;text-align:center;z-index:6;}
  .eyebrow{font-weight:700;font-size:20px;letter-spacing:.38em;text-transform:uppercase;color:var(--cognac);margin-bottom:16px;}
  .title{font-family:'Fraunces';font-weight:600;font-size:70px;letter-spacing:-.012em;color:var(--ink);
    text-shadow:0 1px 0 rgba(255,255,255,.35);}
  .title .it{font-style:italic;font-weight:500;color:#8A4A24;}
  .cap{position:absolute;bottom:46px;left:0;right:0;text-align:center;color:var(--pewter);
    font-weight:600;font-size:19px;letter-spacing:.22em;text-transform:uppercase;z-index:6;}
  svg.art{position:absolute;inset:0;}
  .item{position:absolute;width:250px;text-align:center;z-index:5;}
  .yr{font-family:'Fraunces';font-weight:700;font-size:40px;color:var(--cognac);line-height:1;letter-spacing:-.01em;}
  .nm{font-family:'Fraunces';font-weight:600;font-size:26px;line-height:1.12;margin:9px 0 8px;color:var(--ink);}
  .ds{font-family:'Hanken Grotesk';font-style:italic;font-weight:400;font-size:19px;color:#6b6253;line-height:1.28;}
</style>
</head>
<body>
  <div id="stage">
    <div class="head">
      <div class="eyebrow">Jenny's Creative Lab</div>
      <div class="title">A Sound in <span class="it">Seven Records</span></div>
    </div>

    <svg class="art" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
      <defs>
        <filter id="softsh" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10"/></filter>
      </defs>
      <g id="scene"></g>
    </svg>
    <div id="items"></div>

    <div id="light"></div>
    <div id="vignette"></div>
    <div id="grain"></div>

    <div class="cap">Garage rock to art rock &nbsp;&bull;&nbsp; jenn.ghost.io</div>
  </div>

  <script>
    const NS='http://www.w3.org/2000/svg';
    const scene=document.getElementById('scene');
    const items=document.getElementById('items');
    const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
    const shade=(hex,amt)=>{const c=hex.replace('#','');const n=parseInt(c,16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');};
    const arc=(cx,cy,r,a0,a1)=>{const p0=[cx+r*Math.cos(a0*Math.PI/180),cy+r*Math.sin(a0*Math.PI/180)],p1=[cx+r*Math.cos(a1*Math.PI/180),cy+r*Math.sin(a1*Math.PI/180)],large=(a1-a0)%360>180?1:0;return `M ${p0[0]} ${p0[1]} A ${r} ${r} 0 ${large} 1 ${p1[0]} ${p1[1]}`;};

    function vinyl(parent,cx,cy,R,label){
      const uid='v'+Math.random().toString(36).slice(2,8);
      const defs=el('defs',{});
      const body=el('radialGradient',{id:uid+'b',cx:'50%',cy:'50%',r:'50%'});
      body.appendChild(el('stop',{offset:'0%','stop-color':'#1a1a1c'}));
      body.appendChild(el('stop',{offset:'62%','stop-color':'#0c0c0e'}));
      body.appendChild(el('stop',{offset:'100%','stop-color':'#050506'}));
      defs.appendChild(body);
      const spec=el('radialGradient',{id:uid+'s',cx:'34%',cy:'26%',r:'60%'});
      spec.appendChild(el('stop',{offset:'0%','stop-color':'rgba(255,248,232,0.5)'}));
      spec.appendChild(el('stop',{offset:'40%','stop-color':'rgba(255,240,214,0.08)'}));
      spec.appendChild(el('stop',{offset:'65%','stop-color':'rgba(255,240,214,0)'}));
      defs.appendChild(spec);
      const lab=el('radialGradient',{id:uid+'l',cx:'38%',cy:'30%',r:'70%'});
      lab.appendChild(el('stop',{offset:'0%','stop-color':shade(label,28)}));
      lab.appendChild(el('stop',{offset:'72%','stop-color':label}));
      lab.appendChild(el('stop',{offset:'100%','stop-color':shade(label,-26)}));
      defs.appendChild(lab);
      parent.appendChild(defs);

      parent.appendChild(el('ellipse',{cx:cx,cy:cy+R*0.9,rx:R*0.98,ry:R*0.26,fill:'#241a10','fill-opacity':0.26,filter:'url(#softsh)'}));
      parent.appendChild(el('circle',{cx,cy,r:R,fill:`url(#${uid}b)`}));
      const gg=el('g',{});const n=16;
      for(let i=0;i<n;i++){const rr=R*0.4+(R*0.56)*(i/n);gg.appendChild(el('circle',{cx,cy,r:rr,fill:'none',stroke:'#000','stroke-opacity':(i%2?0.5:0.28),'stroke-width':R*0.02}));}
      parent.appendChild(gg);
      parent.appendChild(el('circle',{cx,cy,r:R,fill:`url(#${uid}s)`}));
      const lr=R*0.36;
      parent.appendChild(el('circle',{cx,cy,r:lr,fill:`url(#${uid}l)`}));
      parent.appendChild(el('circle',{cx,cy,r:lr,fill:'none',stroke:'#000','stroke-opacity':0.18,'stroke-width':R*0.03}));
      parent.appendChild(el('circle',{cx,cy,r:R*0.05,fill:'#F2ECDD'}));
      parent.appendChild(el('circle',{cx,cy,r:R-1,fill:'none',stroke:'#000','stroke-opacity':0.5,'stroke-width':1.5}));
      parent.appendChild(el('path',{d:arc(cx,cy,R-1.5,200,320),fill:'none',stroke:'rgba(255,246,228,0.55)','stroke-width':2,'stroke-linecap':'round'}));
    }

    const SPINE=468, X0=200, GAP=200;
    const data=[
      {yr:'2006', nm:'Whatever People Say I&nbsp;Am', ds:'garage rock', c:'#A85C2E', up:true},
      {yr:'2007', nm:'Favourite Worst Nightmare', ds:'faster, meaner', c:'#B0663A', up:false},
      {yr:'2009', nm:'Humbug', ds:'desert rock', c:'#9C6B4E', up:true},
      {yr:'2011', nm:'Suck It and See', ds:'melodic guitar-pop', c:'#8A6E63', up:false},
      {yr:'2013', nm:'AM', ds:'bluesy, nocturnal', c:'#6E6B73', up:true},
      {yr:'2018', nm:'Tranquility Base Hotel &amp; Casino', ds:'lounge piano', c:'#5E6E78', up:false},
      {yr:'2022', nm:'The Car', ds:'string-soaked art-rock', c:'#4F6168', up:true},
    ];

    // spine with subtle warm-to-cool gradient
    const grad=el('linearGradient',{id:'spine',x1:'0',y1:'0',x2:'1',y2:'0'});
    grad.appendChild(el('stop',{offset:'0%','stop-color':'#A85C2E','stop-opacity':0.85}));
    grad.appendChild(el('stop',{offset:'50%','stop-color':'#8A6E63','stop-opacity':0.8}));
    grad.appendChild(el('stop',{offset:'100%','stop-color':'#4F6168','stop-opacity':0.85}));
    const d0=el('defs',{});d0.appendChild(grad);scene.appendChild(d0);
    // soft under-shadow for the spine, then the spine itself
    scene.appendChild(el('line',{x1:120,y1:SPINE+1.5,x2:1480,y2:SPINE+1.5,stroke:'#241a10','stroke-opacity':0.12,'stroke-width':5}));
    scene.appendChild(el('line',{x1:120,y1:SPINE,x2:1480,y2:SPINE,stroke:'url(#spine)','stroke-width':3.25,'stroke-linecap':'round'}));

    data.forEach((d,i)=>{
      const x=X0+i*GAP;
      scene.appendChild(el('line',{x1:x,y1:SPINE,x2:x,y2:d.up?SPINE-64:SPINE+64,stroke:d.c,'stroke-width':2.5,'stroke-opacity':0.5}));
      vinyl(scene,x,SPINE,27,d.c);
      const div=document.createElement('div');
      div.className='item';
      div.style.left=(x-125)+'px';
      div.innerHTML=`<div class="yr">${d.yr}</div><div class="nm">${d.nm}</div><div class="ds">${d.ds}</div>`;
      items.appendChild(div);
      if(d.up){div.style.top='auto';div.style.bottom=(900-(SPINE-84))+'px';}
      else{div.style.top=(SPINE+84)+'px';}
    });

    const svgGrain="data:image/svg+xml;utf8,"+encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'>"+
      "<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='2'/>"+
      "<feColorMatrix type='saturate' values='0'/></filter>"+
      "<rect width='260' height='260' filter='url(#n)'/></svg>");
    document.getElementById('grain').style.background="url(\""+svgGrain+"\")";
  </script>
</body>
</html>
