<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face{font-family:'Fraunces';src:url('../assets/fonts/Fraunces.ttf') format('truetype');font-weight:400 900;font-style:normal;font-display:block;}
  @font-face{font-family:'Fraunces';src:url('../assets/fonts/Fraunces-Italic.ttf') format('truetype');font-weight:400 900;font-style:italic;font-display:block;}
  @font-face{font-family:'Hanken Grotesk';src:url('../assets/fonts/HankenGrotesk.ttf') format('truetype');font-weight:300 800;font-style:normal;font-display:block;}
  :root{
    --cream:#F2ECDD; --cream-hi:#FBF6EC; --cream-lo:#DED2BB;
    --cognac:#A85C2E; --cognac-lo:#8A4A24;
    --charcoal:#241f18; --ink:#332c22; --pewter:#8B8579;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#c9c4ba;}
  #stage{
    position:relative;width:1600px;height:900px;overflow:hidden;
    font-family:'Hanken Grotesk',sans-serif;color:var(--charcoal);
    background:
      radial-gradient(150% 130% at 22% 8%, var(--cream-hi) 0%, var(--cream) 38%, var(--cream-lo) 100%);
  }
  /* one warm directional light bloom, upper-left */
  #light{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(48% 46% at 24% 14%, rgba(255,244,214,.55), rgba(255,244,214,0) 62%);
    mix-blend-mode:screen;}
  /* warm light-leak, upper-right corner */
  #leak{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(38% 44% at 96% 6%, rgba(210,120,52,.30), rgba(210,120,52,0) 60%);
    mix-blend-mode:screen;}
  /* cinematic vignette */
  #vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 110% at 42% 46%, rgba(0,0,0,0) 52%, rgba(40,28,16,.22) 100%);}
  #grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:multiply;pointer-events:none;}
  svg.art{position:absolute;inset:0;}
  .copy{position:absolute;left:104px;top:150px;width:720px;z-index:6;}
  .eyebrow{font-weight:700;font-size:20px;letter-spacing:.36em;text-transform:uppercase;color:var(--cognac);margin-bottom:34px;}
  .eyebrow .dot{color:var(--pewter);margin:0 14px;}
  h1{font-family:'Fraunces';font-weight:600;color:var(--ink);font-size:107px;line-height:.96;letter-spacing:-.018em;
     text-shadow:0 1px 0 rgba(255,255,255,.35);}
  h1 .it{font-style:italic;font-weight:500;color:var(--cognac-lo);}
  .rule{width:96px;height:5px;background:linear-gradient(90deg,var(--cognac),var(--cognac-lo));border-radius:3px;margin:44px 0 36px;}
  .sub{font-weight:400;font-size:29px;line-height:1.44;color:#5c5344;max-width:498px;}
  .byline{position:absolute;left:104px;bottom:58px;z-index:6;font-weight:600;font-size:18px;
    letter-spacing:.24em;text-transform:uppercase;color:var(--pewter);}
</style>
</head>
<body>
  <div id="stage">
    <svg class="art" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
      <defs>
        <filter id="dof" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
        <filter id="softsh" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
      </defs>
      <g id="scene"></g>
    </svg>

    <div id="light"></div>
    <div id="leak"></div>
    <div id="vignette"></div>
    <div id="grain"></div>

    <div class="copy">
      <div class="eyebrow">Jenny's Creative Lab <span class="dot">&bull;</span> The Long Read</div>
      <h1>From Garage&nbsp;Rock<br/>to <span class="it">Art&nbsp;Rock</span></h1>
      <div class="rule"></div>
      <div class="sub">Twenty years, seven albums, one band that refuses to stand still &mdash; tracing the Arctic Monkeys sound, record by record.</div>
    </div>
    <div class="byline">A Vinyl Story &bull; 2026</div>
  </div>

  <script>
    const NS='http://www.w3.org/2000/svg';
    const scene=document.getElementById('scene');
    const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};

    // Photoreal record, face-on. Single light source from upper-left (~135deg).
    function vinyl(parent,cx,cy,R,label,{rot=0,dark=0}={}){
      const g=el('g',{transform:`rotate(${rot} ${cx} ${cy})`});
      // gradient defs (unique ids)
      const uid='v'+Math.random().toString(36).slice(2,8);
      const defs=el('defs',{});
      const body=el('radialGradient',{id:uid+'b',cx:'50%',cy:'50%',r:'50%'});
      body.appendChild(el('stop',{offset:'0%','stop-color':'#1a1a1c'}));
      body.appendChild(el('stop',{offset:'60%','stop-color':'#0d0d0f'}));
      body.appendChild(el('stop',{offset:'100%','stop-color':'#050506'}));
      defs.appendChild(body);
      // specular crescent — light from upper-left
      const spec=el('radialGradient',{id:uid+'s',cx:'32%',cy:'24%',r:'62%'});
      spec.appendChild(el('stop',{offset:'0%','stop-color':'rgba(255,248,232,0.42)'}));
      spec.appendChild(el('stop',{offset:'34%','stop-color':'rgba(255,240,214,0.10)'}));
      spec.appendChild(el('stop',{offset:'62%','stop-color':'rgba(255,240,214,0)'}));
      defs.appendChild(spec);
      const lab=el('radialGradient',{id:uid+'l',cx:'38%',cy:'30%',r:'70%'});
      lab.appendChild(el('stop',{offset:'0%','stop-color':shade(label,26)}));
      lab.appendChild(el('stop',{offset:'70%','stop-color':label}));
      lab.appendChild(el('stop',{offset:'100%','stop-color':shade(label,-28)}));
      defs.appendChild(lab);
      g.appendChild(defs);

      // contact shadow
      parent.appendChild(el('ellipse',{cx:cx,cy:cy+R*0.98,rx:R*0.94,ry:R*0.20,fill:'#241a10','fill-opacity':0.28,filter:'url(#softsh)'}));

      // disc body
      g.appendChild(el('circle',{cx,cy,r:R,fill:`url(#${uid}b)`}));

      // grooves
      const gg=el('g',{});
      const n=42;
      for(let i=0;i<n;i++){
        const rr=R*0.335 + (R*0.63)*(i/n);
        gg.appendChild(el('circle',{cx,cy,r:rr,fill:'none',stroke:'#000','stroke-opacity':(i%2?0.55:0.30),'stroke-width':R*0.0042}));
        if(i%2===0) gg.appendChild(el('circle',{cx,cy,r:rr+R*0.0016,fill:'none',stroke:'#fff','stroke-opacity':0.035,'stroke-width':R*0.0022}));
      }
      g.appendChild(gg);

      // specular sweep on top of grooves
      g.appendChild(el('circle',{cx,cy,r:R,fill:`url(#${uid}s)`}));

      // label
      const lr=R*0.325;
      g.appendChild(el('circle',{cx,cy,r:lr,fill:`url(#${uid}l)`}));
      g.appendChild(el('circle',{cx,cy,r:lr,fill:'none',stroke:'#000','stroke-opacity':0.18,'stroke-width':R*0.006}));
      g.appendChild(el('circle',{cx,cy,r:lr*0.62,fill:'none',stroke:'#000','stroke-opacity':0.10,'stroke-width':R*0.004}));
      // spindle
      g.appendChild(el('circle',{cx,cy,r:R*0.018,fill:'#F2ECDD'}));
      g.appendChild(el('circle',{cx,cy,r:R*0.018,fill:'none',stroke:'#000','stroke-opacity':0.3,'stroke-width':1}));

      // rim: bright upper-left, dark lower-right
      g.appendChild(el('circle',{cx,cy,r:R-1,fill:'none',stroke:'#000','stroke-opacity':0.55,'stroke-width':2}));
      const rimHi=el('path',{d:arc(cx,cy,R-2,200,320),fill:'none',stroke:'rgba(255,246,228,0.5)','stroke-width':2.4,'stroke-linecap':'round'});
      g.appendChild(rimHi);

      if(dark>0){
        g.appendChild(el('circle',{cx,cy,r:R,fill:'#0a0705','fill-opacity':dark}));
      }
      parent.appendChild(g);
    }
    function arc(cx,cy,r,a0,a1){
      const p0=[cx+r*Math.cos(a0*Math.PI/180),cy+r*Math.sin(a0*Math.PI/180)];
      const p1=[cx+r*Math.cos(a1*Math.PI/180),cy+r*Math.sin(a1*Math.PI/180)];
      const large=(a1-a0)%360>180?1:0;
      return `M ${p0[0]} ${p0[1]} A ${r} ${r} 0 ${large} 1 ${p1[0]} ${p1[1]}`;
    }
    function shade(hex,amt){
      const c=hex.replace('#','');const n=parseInt(c,16);
      let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
      r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
      return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
    }

    // --- compose: a companion disc softly behind, then the hero ---
    const bg=el('g',{filter:'url(#dof)'});
    vinyl(bg,1300,300,300,'#5E6E78',{rot:0,dark:0.30});   // cool horizon, blurred, receding
    scene.appendChild(bg);
    vinyl(scene,1150,540,352,'#A85C2E',{rot:-7});          // hero — the warm origin

    // dust flecks
    const dust=el('g',{});
    for(let i=0;i<26;i++){
      dust.appendChild(el('circle',{cx:Math.random()*1600,cy:Math.random()*900,r:Math.random()*1.5+0.3,
        fill:'#fff','fill-opacity':(Math.random()*0.18+0.04)}));
    }
    scene.appendChild(dust);

    // film grain
    const svgGrain="data:image/svg+xml;utf8,"+encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'>"+
      "<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='2'/>"+
      "<feColorMatrix type='saturate' values='0'/></filter>"+
      "<rect width='260' height='260' filter='url(#n)'/></svg>");
    document.getElementById('grain').style.background="url(\""+svgGrain+"\")";
  </script>
</body>
</html>
