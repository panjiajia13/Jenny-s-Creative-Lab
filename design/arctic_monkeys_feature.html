<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face{
    font-family:'Fraunces';
    src:url('../assets/fonts/Fraunces.ttf') format('truetype');
    font-weight:400 900; font-style:normal; font-display:block;
  }
  @font-face{
    font-family:'Fraunces';
    src:url('../assets/fonts/Fraunces-Italic.ttf') format('truetype');
    font-weight:400 900; font-style:italic; font-display:block;
  }
  @font-face{
    font-family:'Hanken Grotesk';
    src:url('../assets/fonts/HankenGrotesk.ttf') format('truetype');
    font-weight:300 800; font-style:normal; font-display:block;
  }
  :root{
    --cream:#F4EFE3;
    --cream-2:#EDE6D6;
    --cognac:#A85C2E;
    --charcoal:#352F26;
    --pewter:#9A9488;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#ddd;}
  #stage{
    position:relative;width:1600px;height:900px;overflow:hidden;
    background:
      radial-gradient(120% 120% at 18% 12%, #FBF7EE 0%, var(--cream) 42%, var(--cream-2) 100%);
    font-family:'Hanken Grotesk',sans-serif;color:var(--charcoal);
  }
  /* paper grain */
  #grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:multiply;pointer-events:none;}
  /* text block */
  .copy{position:absolute;left:96px;top:128px;width:760px;z-index:5;}
  .eyebrow{
    font-family:'Hanken Grotesk';font-weight:700;font-size:21px;letter-spacing:.32em;
    text-transform:uppercase;color:var(--cognac);margin-bottom:30px;
  }
  .eyebrow .dot{color:var(--pewter);margin:0 12px;}
  h1{
    font-family:'Fraunces';font-weight:600;color:var(--charcoal);
    font-size:104px;line-height:.98;letter-spacing:-.015em;
  }
  h1 .it{font-style:italic;font-weight:500;}
  .rule{width:104px;height:5px;background:var(--cognac);border-radius:3px;margin:46px 0 34px;}
  .sub{
    font-family:'Hanken Grotesk';font-weight:400;font-size:30px;line-height:1.4;
    color:#5b5346;max-width:496px;
  }
  .byline{
    position:absolute;left:470px;bottom:60px;z-index:5;
    font-family:'Hanken Grotesk';font-weight:600;font-size:19px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--pewter);
  }
  svg{position:absolute;inset:0;}
</style>
</head>
<body>
  <div id="stage">
    <!-- vinyl collection + cassette + soundwave -->
    <svg width="1600" height="900" viewBox="0 0 1600 900" fill="none">
      <defs>
        <radialGradient id="discSheen" cx="38%" cy="32%" r="75%">
          <stop offset="0%" stop-color="#2c2c2e"/>
          <stop offset="55%" stop-color="#161617"/>
          <stop offset="100%" stop-color="#050506"/>
        </radialGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#352F26" flood-opacity="0.18"/>
        </filter>
        <filter id="grainf"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
          <feColorMatrix type="saturate" values="0"/></filter>
      </defs>

      <!-- a fanned collection of records, lower-right, evolving labels (era colours) -->
      <!-- record 4 (back) -->
      <g filter="url(#soft)" transform="translate(1245,548) rotate(18)">
        <circle r="252" fill="url(#discSheen)"/>
        <g stroke="#000" stroke-opacity="0.5" fill="none">
          <circle r="232"/><circle r="208"/><circle r="184"/><circle r="160"/><circle r="136"/>
        </g>
        <circle r="84" fill="#6E7B74"/><circle r="13" fill="var(--cream)"/>
      </g>
      <!-- record 3 -->
      <g filter="url(#soft)" transform="translate(1130,612) rotate(8)">
        <circle r="252" fill="url(#discSheen)"/>
        <g stroke="#000" stroke-opacity="0.5" fill="none">
          <circle r="232"/><circle r="208"/><circle r="184"/><circle r="160"/><circle r="136"/>
        </g>
        <circle r="84" fill="#C9A24B"/><circle r="13" fill="var(--cream)"/>
      </g>
      <!-- record 2 -->
      <g filter="url(#soft)" transform="translate(1015,672) rotate(-4)">
        <circle r="252" fill="url(#discSheen)"/>
        <g stroke="#000" stroke-opacity="0.5" fill="none">
          <circle r="232"/><circle r="208"/><circle r="184"/><circle r="160"/><circle r="136"/>
        </g>
        <circle r="84" fill="#7C5C86"/><circle r="13" fill="var(--cream)"/>
      </g>
      <!-- record 1 (front, cognac = the origin) -->
      <g filter="url(#soft)" transform="translate(905,726) rotate(-15)">
        <circle r="252" fill="url(#discSheen)"/>
        <g stroke="#000" stroke-opacity="0.5" fill="none">
          <circle r="232"/><circle r="208"/><circle r="184"/><circle r="160"/><circle r="136"/>
        </g>
        <circle r="84" fill="var(--cognac)"/>
        <circle r="84" fill="none" stroke="#000" stroke-opacity=".15"/>
        <circle r="13" fill="var(--cream)"/>
      </g>

      <!-- cassette tape, tucked into the bottom-left corner below the copy -->
      <g filter="url(#soft)" transform="translate(238,820) rotate(-8) scale(0.92)">
        <rect x="-150" y="-92" width="300" height="184" rx="16" fill="#3A342B"/>
        <rect x="-132" y="-74" width="264" height="120" rx="9" fill="#EAE2D0"/>
        <rect x="-132" y="-74" width="264" height="34" rx="9" fill="#D8CDB4"/>
        <!-- reels -->
        <circle cx="-58" cy="6" r="36" fill="#2A251E"/><circle cx="-58" cy="6" r="13" fill="#EAE2D0"/>
        <circle cx="58"  cy="6" r="36" fill="#2A251E"/><circle cx="58"  cy="6" r="13" fill="#EAE2D0"/>
        <rect x="-92" y="2" width="184" height="9" fill="#2A251E" opacity=".25"/>
        <rect x="-150" y="58" width="300" height="34" rx="8" fill="#46402F" opacity=".0"/>
        <rect x="-120" y="62" width="240" height="20" rx="6" fill="#A85C2E" opacity=".85"/>
      </g>

    </svg>

    <div id="grain"></div>

    <div class="copy">
      <div class="eyebrow">Jenny's Creative Lab <span class="dot">&bull;</span> The Long Read</div>
      <h1>From Garage&nbsp;Rock<br/>to <span class="it">Art&nbsp;Rock</span></h1>
      <div class="rule"></div>
      <div class="sub">Twenty years, seven albums, one band that refuses to stand still &mdash; tracing the Arctic Monkeys sound, record by record.</div>
    </div>

    <div class="byline">A Vinyl Story &bull; 2026</div>
  </div>

  <script>
    // paint SVG grain into the overlay div
    const svgGrain =
      "data:image/svg+xml;utf8," + encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'>"+
      "<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/>"+
      "<feColorMatrix type='saturate' values='0'/></filter>"+
      "<rect width='240' height='240' filter='url(#n)'/></svg>");
    document.getElementById('grain').style.background = "url(\"" + svgGrain + "\")";
  </script>
</body>
</html>
